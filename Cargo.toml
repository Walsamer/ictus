[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/policy",
    "crates/ports",
    "crates/bridge",
    "crates/adapters",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0"
repository = "https://github.com/Walsamer/ictus"
homepage = "https://github.com/Walsamer/ictus"

[workspace.dependencies]
ictus-core = { path = "crates/core" }
ictus-policy = { path = "crates/policy" }
ictus-ports = { path = "crates/ports" }
ictus-adapters = { path = "crates/adapters" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
sha2 = "0.10"

[profile.release]
lto = "thin"
