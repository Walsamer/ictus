[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/policy",
    "crates/ports",
    "crates/bridge",
    "crates/adapters",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0"
repository = "https://github.com/Walsamer/ictus"
homepage = "https://github.com/Walsamer/ictus"

[workspace.dependencies]
ictus-core = { path = "crates/core" }
ictus-policy = { path = "crates/policy" }
ictus-ports = { path = "crates/ports" }
ictus-adapters = { path = "crates/adapters" }
serde = { version = "1", features = ["derive"] }
# Enabled workspace-wide: the identity-digest contract (docs/IDENTITY_DIGEST.md)
# requires a float literal to parse to the same double on both sides of the
# Ictus/Tactus boundary. Without it serde_json's default parser rounds a
# literal such as `9007199254740993.0` differently from CPython, which would
# make the same fact digest differently in the two implementations.
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "1"
sha2 = "0.10"

[profile.release]
lto = "thin"
