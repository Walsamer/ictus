[project]
name = "ictus"
version = "0.1.0"
description = "Typed decision and policy layer for agentic systems, with Dagster as the durable execution substrate."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12,<3.13"
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "dagster>=1.8,<2",
]

[project.scripts]
ictus-bridge = "ictus_dagster.bridge:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/ictus_dagster"]

[dependency-groups]
dev = [
    "pytest>=8",
    "jsonschema>=4",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
pythonpath = ["python"]
filterwarnings = ["ignore::DeprecationWarning"]
addopts = "--cov=ictus_dagster --cov-report=term-missing"

[tool.coverage.run]
source = ["ictus_dagster"]
branch = true

[tool.coverage.report]
fail_under = 99
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
