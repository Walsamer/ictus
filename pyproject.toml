[project]
name = "agentic-control"
version = "0.1.0"
description = "Typed agentic decision-and-policy layer above a durable execution engine (Dagster)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dagster>=1.8,<2",
]

[project.scripts]
agentic-bridge = "agentic_dagster.bridge:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/agentic_dagster"]

[dependency-groups]
dev = [
    "pytest>=8",
    "jsonschema>=4",
]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
pythonpath = ["python"]
filterwarnings = ["ignore::DeprecationWarning"]
