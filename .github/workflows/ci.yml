name: ci

on:
  push:
    branches: ["main"]
  pull_request:

# One run per ref: a branch with an open PR is validated only by the
# pull_request event, and a rapid re-push cancels the superseded run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace

  python:
    name: python (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: sync
        run: uv sync --frozen
      - name: pytest
        run: uv run --frozen pytest -q

  verify-integration:
    name: integration verifier (Fleet parity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: taiki-e/install-action@cargo-mutants
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      # Runs the exact command Fleet registers as the ictus verifier, so the
      # wrapper and CI cannot drift: verify + coverage + e2e + property tests
      # (PROPTEST_CASES=1024) + mutation.
      - name: run scripts/verify-integration.sh
        run: ./scripts/verify-integration.sh
