name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace

  python:
    name: python (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: sync
        run: uv sync --frozen
      - name: pytest
        run: uv run --frozen pytest -q

  e2e:
    name: rust <-> dagster end to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: build rust bridge
        run: cargo build -q -p ictus-bridge
      - name: sync python
        run: uv sync --frozen
      - name: run boundary proof
        run: ./scripts/e2e_rust_dagster.sh

  coverage:
    name: coverage thresholds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: rust line coverage (>= 95%)
        run: >-
          cargo llvm-cov --workspace --summary-only
          --ignore-filename-regex '(tests/|fixtures/)' --fail-under-lines 95
      - name: python coverage (>= 99%, enforced by pyproject)
        run: |
          uv sync --frozen
          uv run --frozen pytest -q
